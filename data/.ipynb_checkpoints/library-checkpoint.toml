[[Current_sense_resistor]]
# Цельно сваренный металический корпус - Power Metal Strip - серия WSLP5931, L2000 ( 200 мк ), точность F = +- 1%
component_type = "current_sense_resistor" # Тип - не просто резистор, а токовый измерительный шунт четырёхконтактный, по факту резистор, НО для compiler в маппинге будет наглядная связь: typee = shunt + package = 5931 -> будет сразу понятно что это KiCad Footprint = "Resistor_SMD:V_WSLP5931..." - а это сразу гарантирует правильное пасадочное место!
name = "Vishay Dale WSLP5931L2000FEA" # Название компонента
resistance_ohm = 0.0002 # 200 микроом
tolerance_percent = 1.0_f32 # Допустимая погрешность
package = 5931 # Мощные корпус/габариты
max_current_amp = 200 # максимальный ток в амперах, который шунт может пропускать через себя длительное время (> 220
power_rating_watt = 15.0 # Заявлена мксимальная энергия, которая может быть рассеяна теплом на корпусе в среднем P = 15 Ват! - Нужна будет для описания схемы теплового расчёта на тестах для перегрева! 
temperature_coefficient_ppm = 225.0 # Температурный коэффициент сопротивления (ТКС или TCR) согласно параметру из даташита параметр из даташита (±225 ppm/°C)
operating_temperature_min_c = -65 # Нижняя граница рабочей температуры!
operating_temperature_max_c = 170 # Верхняя граница рабочей температуры!
# ВАЖНО: Далее - на этапе пректирвоания analizer - системы, необходимо будет рассчитать падение напряжения (U = I * R = 200A * 0.0002Ω = 0.04V), выделяемую мощность (P = U * I = 8W) и смоделировать нагрев, показатели которые получатся по итогу могут повлиять на изменение первоначальных параметров платы (Flight_controller_board)!
#--------------------------------------------------------------------------------------------------------------------------------------------

[[Flight_controller_board]]
# F.Cu    ← Верх: сигналы, компоненты, полигон GND - верхний слой меди (лицевой)
# In1.Cu  ← Внутри №1: первый внутренний слой - слой земли (сплошная заливка)
# In2.Cu  ← Внутри №2: второй внутренний слой - слой питания (силовая разводка)
# B.Cu    ← Низ: нижний слой меди (обратная сторона) - силовые дорожки 200А + термо-зоны
# -------------------------------------------------------------------------------------------------------------------------------------------
# Что бы compiler понял, что это не тестовая плата и включил режим генерации board outline!
component_type = "flight_controller_board"
# Записываем название для дальнейшего отображения в метаданные проекта KiCad и как имя в Renode!
name = "Drone FC Board Heavy v1.0"
# 4 слоя меди - F.Cu: (сигналы), In1.Cu: GND (земля), In2.Cu: PWR (питание), B.Cu: (силовые дорожки)!
layers = 4
# Производственные заметки для Gerber!
material = "FR-4 High-Tg" 
# Чертит горизонтальную границу контура платы (ось X) до Edge.Cuts ( что бы понимать где обрезаем плату по ширине )!
width_mm = 36.0
# Чертит вертикальную границу контура платы (ось Y) до Edge.Cuts ( что бы понимать где обрезаем плату по высоте )!
height_mm = 56.0
# Толщина медных слоёв (2 унции меди на квадратный фунт - 0.07 мм) - Будет влияет на тепловой расчёт в analyzer и на производственные заметки для создания .gerber!
copper_thickness_um = 70
# Фигура платы в виде прямоугольника и вместо прямых углов добавляем дуги (gr_arc) по углам контура!
shape = "rect_round"
# Радиус скругления углов по концам платы в миллиметрах!
corner_radius_mm = 3.0
# 4 отверстия pad типа NPTH (пустые монтажные отверстия под саморезы) по углам платы!
mounting_holes = 4
# Диаметр каждого монтажного отверстия!
mounting_hole_diameter_mm = 2.0
# Добавит команду zone на верхний слой (F.Cu), привязанную к GND!
copper_pour_top = true
# Добавит команду zone на нижний слой (B.Cu), привязанную к цепи GND!
copper_pour_bottom = true
# Размещает массив переходных отверстий под силовыми компонентами для отвода тепла!
thermal_vias = true
# Диаметр каждого переходного отверстия для отвода тепла!
thermal_via_diameter_mm = 0.5
# Расстояние между центрами переходных отверстий ( которые будут располагаться в виде сетки)!
thermal_via_pitch_mm = 1.2
# Максимальная сила тока в амперах, которую плата должна выдерживать.. Нужно, для передачи в analyzer для расчёта падения напряжения и нагрева, в KiCad задаёт минимальную ширину дорожек!
max_current_amp = 200
# Верхняя граница тепла по даташиту по цельсию, для теплового теста в analyzer, при превышении — выбрасывается предупреждение!
max_temp_c = 170
# минимальная ширина дорожки - Для меди толщиной 70 мкм (2 oz) стандартный техпроцесс большинства фабрик требует минимальную ширину дорожки 0.20 мм. Это значение гарантирует, что дорожка не будет перетравлена и сохранит проектное сечение по всей длине, + мы берём с запасом!
min_trace_width_mm =  0.30
# минимальный зазор между дорожками - Для меди 70 мкм стандартный минимальный зазор — тоже 0.20 мм. При меньшем зазоре на 2 oz меди возрастает риск образования "усов" при травлении и короткого замыкания. Особенно критично для силовой части, где у нас 200 А
min_clearance_mm = 0.20
#--------------------------------------------------------------------------------------------------------------------------------------------



[[Precision_detector_lamp]]
name = "Precision Voltage Detector Lamp 3.698V"
component_type = "precision_detector_lamp"
# Напряжение, при котором лампа загорается (строго)
trigger_voltage_v = 3.698
# Допустимое отклонение от trigger_voltage_v, при котором лампа ещё горит
tolerance_mv = 0.0
# Состояние: горит только при U = trigger_voltage_v ± tolerance_mv
trigger_mode = "exact_match"
# Ниже trigger_voltage_v — не горит
below_trigger_state = "off"
# Выше trigger_voltage_v — не горит
above_trigger_state = "off"
# Потребляемый ток в режиме свечения
current_draw_a = 10.0
# Тип нагрузки
load_type = "resistive"
# Сопротивление в режиме свечения
resistance_hot_ohm = 0.3698
# Задержка включения для фильтрации ложных срабатываний
debounce_ms = 1.0
